<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS-plan — Échafaudage</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:sans-serif; background:#1a1a2e; color:#fff; display:flex; flex-direction:column; align-items:center; padding:20px; }
  h1 { font-size:24px; margin-bottom:10px; }
  .info { background:#16213e; border-radius:12px; padding:15px 25px; margin-bottom:20px; text-align:center; }
  .info .m2 { font-size:42px; font-weight:bold; color:#0f4c75; }
  .scene { position:relative; width:320px; height:420px; }
  .house { position:absolute; left:85px; top:120px; width:150px; height:180px; background:#c9a66b; border:3px solid #8b6914; border-radius:4px; }
  .house::before { content:""; position:absolute; top:-60px; left:-20px; width:190px; height:70px; background:#8b4513; clip-path:polygon(50% 0%, 100% 100%, 0% 100%); }
  .roof-window { position:absolute; top:-40px; left:70px; width:40px; height:30px; background:#87ceeb; border:2px solid #555; }
  .door { position:absolute; bottom:0; left:55px; width:40px; height:70px; background:#5c4033; border-radius:20px 20px 0 0; }
  .window { position:absolute; width:35px; height:35px; background:#add8e6; border:2px solid #555; }
  .w1 { top:40px; left:20px; } .w2 { top:40px; right:20px; } .w3 { top:100px; left:20px; }
  .scaffold { position:absolute; border:4px solid #e67e22; background:rgba(230,126,34,0.15); border-radius:4px; }
  .s1 { left:40px; top:60px; width:240px; height:60px; }   /* haut */
  .s2 { left:40px; top:180px; width:240px; height:60px; } /* milieu */
  .s3 { left:40px; top:300px; width:240px; height:60px; } /* bas */
  .s4 { left:40px; top:60px; width:60px; height:300px; }  /* gauche */
  .s5 { left:220px; top:60px; width:60px; height:300px; } /* droite */
  .plank { position:absolute; height:8px; background:#d35400; border-radius:2px; }
  .label { position:absolute; font-size:13px; font-weight:bold; color:#f39c12; white-space:nowrap; }
  .dims { margin-top:15px; font-size:15px; color:#aaa; text-align:center; line-height:1.6; }
</style>
</head>
<body>
  <h1>🏗️ SS-plan</h1>
  <div class="info">
    <div>Surface au sol</div>
    <div class="m2">200 m²</div>
  </div>
  <div class="scene">
    <div class="scaffold s1"></div>
    <div class="scaffold s2"></div>
    <div class="scaffold s3"></div>
    <div class="scaffold s4"></div>
    <div class="scaffold s5"></div>
    <div class="plank" style="left:50px;top:95px;width:220px;"></div>
    <div class="plank" style="left:50px;top:215px;width:220px;"></div>
    <div class="plank" style="left:50px;top:335px;width:220px;"></div>
    <div class="house">
      <div class="roof-window"></div>
      <div class="window w1"></div>
      <div class="window w2"></div>
      <div class="window w3"></div>
      <div class="door"></div>
    </div>
    <div class="label" style="left:130px;top:45px;">12 m</div>
    <div class="label" style="left:300px;top:200px;">20 m</div>
  </div>
  <div class="dims">
    Maison : 10 m × 20 m = 200 m²<br>
    Échafaudage : périmètre 60 m, hauteur 12 m<br>
    Surface échafaudée : ~720 m²
  </div>
</body>
</html>
